# Easypanel configuration for RentaFlow Dashboard
name: rentaflow-dashboard
description: Dashboard de gestión de leads y propiedades de RentaFlow

services:
  app:
    type: app
    build: .
    port: 3000
    domains:
      - ${APP_DOMAIN}
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXTCLOUD_URL=${NEXTCLOUD_URL}
      - NEXTCLOUD_USERNAME=${NEXTCLOUD_USERNAME}
      - NEXTCLOUD_PASSWORD=${NEXTCLOUD_PASSWORD}
      - NEXTCLOUD_ROOT_PATH=${NEXTCLOUD_ROOT_PATH}
      - NEXTCLOUD_ALLOW_INSECURE=${NEXTCLOUD_ALLOW_INSECURE}
    
    # Health check configuration
    healthcheck:
      path: /
      port: 3000
      initialDelay: 10
      period: 30

# Variables de entorno requeridas
variables:
  - name: NEXT_PUBLIC_SUPABASE_URL
    description: URL de tu instancia de Supabase
    default: https://tu-proyecto.supabase.co
  - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
    description: API Key anónima de Supabase
    default: tu-clave-anonima-supabase
  - name: SUPABASE_SERVICE_ROLE_KEY
    description: Service role key de Supabase
    default: tu-clave-service-role
  - name: NEXTCLOUD_URL
    description: URL base de Nextcloud (ej: https://nextcloud.tudominio.com)
    default: https://nextcloud.local
  - name: NEXTCLOUD_USERNAME
    description: Usuario de Nextcloud para WebDAV
    default: usuario
  - name: NEXTCLOUD_PASSWORD
    description: Password de Nextcloud para WebDAV
    default: password
  - name: NEXTCLOUD_ROOT_PATH
    description: Carpeta raíz opcional bajo WebDAV (ej: Rentaflow)
    default: Rentaflow
  - name: NEXTCLOUD_ALLOW_INSECURE
    description: Usa 1 para permitir certificados TLS no válidos en Nextcloud
    default: "0"
  - name: APP_DOMAIN
    description: Dominio donde se desplegará la app (ej: dashboard.tudominio.com)
    default: localhost
